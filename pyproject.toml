[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reputation-monitor"
version = "1.0.0"
description = "Local review analysis and snapshot monitoring with CLI and Streamlit interfaces."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Reputation Management Service" }]
dependencies = [
    "beautifulsoup4>=4.12,<5",
    "requests>=2.31,<3",
    "streamlit>=1.39,<2",
]

[project.urls]
Homepage = "https://github.com/elena-hub/reputation-monitor"
Documentation = "https://reputation-management-service.com/en/docs/python-reputation-monitoring/"
Repository = "https://github.com/elena-hub/reputation-monitor"
Issues = "https://github.com/elena-hub/reputation-monitor/issues"

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
reputation-monitor = "reputation_monitor.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
